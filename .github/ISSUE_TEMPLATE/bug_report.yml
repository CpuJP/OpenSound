name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not attach third-party proprietary software or files.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Headphone model and firmware
      placeholder: WH-1000XM5, 2.5.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and GNOME version
      placeholder: Fedora 44, GNOME 50
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Daemon log
      description: Output of `journalctl --user -u opensound -n 100`
      render: text
