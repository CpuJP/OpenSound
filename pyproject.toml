[project]
name = "opensound"
version = "0.1.0"
description = "Non-profit, unofficial Linux controller for WH-1000XM5 headphones (not affiliated with Sony)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Juan Pablo Giraldo Collazos" }]
keywords = ["bluetooth", "headphones", "gnome", "gtk4", "linux"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
# PyGObject, GTK 4 and libadwaita come from the distribution, not from pip.
dependencies = []

[project.urls]
Homepage = "https://github.com/CpuJP/OpenSound"
Issues = "https://github.com/CpuJP/OpenSound/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["opensound"]
