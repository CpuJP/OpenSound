name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Format and protocol/daemon tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Unit and integration tests (no GTK needed)
        run: cargo test --locked -p opensound-core -p opensound-daemon

  fedora:
    name: Full build, clippy and RPM on Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: dnf install -y git cargo rust clippy gtk4-devel libadwaita-devel rpm-build systemd-rpm-macros desktop-file-utils appstream
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: Build RPM
        run: sh packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  extension:
    name: GNOME Shell extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check extension syntax
        run: |
          cp gnome-extension/opensound@cpujp.github.io/extension.js /tmp/extension.mjs
          node --check /tmp/extension.mjs
      - name: Validate metadata
        run: python3 -c "import json; json.load(open('gnome-extension/opensound@cpujp.github.io/metadata.json'))"
