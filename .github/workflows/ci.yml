name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Byte-compile sources
        run: python -m compileall -q opensound

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check extension syntax
        run: |
          cp gnome-extension/opensound@cpujp.github.io/extension.js /tmp/extension.mjs
          node --check /tmp/extension.mjs
      - name: Validate metadata
        run: python3 -c "import json; json.load(open('gnome-extension/opensound@cpujp.github.io/metadata.json'))"
